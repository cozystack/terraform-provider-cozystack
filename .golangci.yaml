version: "2"

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - gochecknoinits
    - wsl
    - lll
    - errchkjson
    - ireturn
    - gocheckcompilerdirectives
    # Deprecated since golangci-lint v2.12.0; no module guard rules configured.
    - gomodguard
    # A typed provider repeats schema field names and description strings across
    # every kind by design; field-name single-sourcing is handled by explicit
    # attr*/spec* constants, and constantising shared descriptions hurts
    # inline readability without adding safety.
    - goconst
    # Generic spec/schema helpers are parameterised for reuse across kinds; a
    # helper currently called with one key/value is intentional, not dead.
    - unparam
    # Per-kind model expand/flatten map different field sets with the same
    # declarative structure; the structural similarity is inherent to a typed
    # multi-kind provider, not copy-paste worth abstracting.
    - dupl
    # Schema default values (replica counts, TTLs, sizes) are declarative
    # configuration copied from the upstream spec, not magic numbers in logic.
    - mnd
  settings:
    dupl:
      threshold: 100
    gocritic:
      disabled-checks:
        - dupImport
        - unnamedResult
        # terraform-plugin-framework mandates value request parameters in the
        # resource/datasource/provider method signatures, so hugeParam is moot.
        - hugeParam
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    funlen:
      lines: 60
      statements: 60
    gocyclo:
      min-complexity: 15
    cyclop:
      max-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    varnamelen:
      max-distance: 5
      min-name-length: 3
      check-receiver: false
      check-return: false
      ignore-type-assert-ok: false
      ignore-map-index-ok: false
      ignore-chan-recv-ok: false
      ignore-decls:
        - wg sync.WaitGroup
        - wg *sync.WaitGroup
        - mu sync.Mutex
        - ok bool
      ignore-names:
        - i
        - w
        - r
        - b
        - c
        - m
        - n
        - v
        - pm
        - tt
        - rw
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples/
      - generated\.go$
    rules:
      - linters:
          - funlen
          - dupl
          - gocognit
          - gocyclo
          - cyclop
          - errcheck
          - testableexamples
          - testpackage
          - forcetypeassert
          - gocritic
          - nlreturn
          - wsl_v5
          - varnamelen
          - unparam
          - modernize
          - gosec
          - testifylint
          - perfsprint
          - paralleltest
          - maintidx
          # Inline error checks and ad-hoc errors are the idiomatic test style.
          - noinlineerr
          - err113
          # Acceptance tests share provider factories via package-level vars.
          - gochecknoglobals
        path: _test\.go
      - linters:
          - forbidigo
          - gocyclo
          - cyclop
          - goconst
          - funlen
          - gocognit
          - nestif
          - gocritic
          - maintidx
        path: examples/
      # Terraform Plugin Framework requires a fixed method set (Metadata,
      # Schema, Configure, Create, Read, Update, Delete) whose order is dictated
      # by the interface, not by funcorder's preferences.
      - linters:
          - funcorder
        path: internal/provider/
      # CRUD handlers do inline error/diagnostics checks per the framework idiom.
      - linters:
          - noinlineerr
        path: internal/provider/
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples/
      - generated\.go$
